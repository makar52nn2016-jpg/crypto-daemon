name: Crypto Daemon + Sniper 24/7

on:
  schedule:
    - cron: '*/5 * * * *'  # daemon + sniper every 5 min
  workflow_dispatch: {}
  push:
    branches: [main]

# CRITICAL: required for GITHUB_TOKEN to have write access — without this,
# the daemon's state.json commits fail silently (was broken for 28h+).
permissions:
  contents: write

# Run only one workflow at a time — prevents race condition when daemon+sniper
# both try to commit state.json simultaneously.
concurrency:
  group: daemon-sniper
  cancel-in-progress: false

jobs:
  daemon-and-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run daemon
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python daemon.py

      - name: Run sniper
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python sniper.py

      - name: Run Trudyagi pipeline (demo mode — autonomous 4-role agent corporation)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
          PIMLICO_API_KEY: ${{ secrets.PIMLICO_API_KEY }}
          # LLM_API_KEY, LLM_BASE_URL, LLM_MODEL — set when ready for real LLM mode
          # Until then, runs in demo mode (mock LLM, no API calls)
        working-directory: trudyagi
        run: |
          # Demo mode runs the full 4-role pipeline with mock LLM
          # to prove the system is alive and artifact-saving works.
          # Switch to `python trudyagi.py run "<goal>"` when LLM_API_KEY is set.
          python trudyagi.py demo "Daily autonomous check — daemon alive + bounties available + Frantic claim status" || true

      - name: Commit state
        continue-on-error: true
        run: |
          # Rebase on latest main to avoid "non-fast-forward" push failures
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --no-edit origin main || true
          git add -A || true
          git commit -m "daemon+sniper+trudyagi state update $(date -u +%FT%TZ)" || true
          # Push using GITHUB_TOKEN (write access via permissions: contents: write)
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
