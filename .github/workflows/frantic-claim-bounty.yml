name: Frantic Claim Deliver

on:
  workflow_dispatch:
    inputs:
      bounty_id:
        description: 'Bounty number'
        required: true
        default: '130'
      action:
        description: 'status list claim deliver'
        required: true
        default: 'status'
      artifact_url:
        description: 'For deliver: URL'
        required: false
        default: ''

jobs:
  frantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          FRANTIC_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
          AGENT_KID: agent-b94b60
          ACTION: ${{ inputs.action }}
          BOUNTY_ID: ${{ inputs.bounty_id }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: python3 .github/scripts/frantic_action.py
