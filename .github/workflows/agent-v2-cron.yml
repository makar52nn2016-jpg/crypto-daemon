name: Agent v2.0 Cycle

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run agent v2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: |
          python3 .github/scripts/agent_v2/agent.py 2>&1 | tee /tmp/agent_run.log
          
          # Append log to a persistent log file in repo
          mkdir -p logs
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "=== Run $ts ===" >> logs/agent_v2.log
          cat /tmp/agent_run.log >> logs/agent_v2.log
          echo "" >> logs/agent_v2.log
          
          # Keep only last 1000 lines to avoid runaway log growth
          tail -n 1000 logs/agent_v2.log > logs/agent_v2.tmp
          mv logs/agent_v2.tmp logs/agent_v2.log
          
          # Commit log back to repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/agent_v2.log
          git commit -m "chore: agent v2.0 cycle $ts" || echo "Nothing to commit"
          git push
