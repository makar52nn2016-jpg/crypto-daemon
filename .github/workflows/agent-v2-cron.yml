name: Agent v2.0 Cycle

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install pynostr websockets playwright --break-system-packages
          playwright install chromium --with-deps
      - name: Run H1 Monitor (Playwright scan for new bounty targets)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 .github/scripts/agent_v2/h1_monitor.py
      - name: Run Agent v2.0 (PR monitoring + Frantic + wallet check)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: python3 .github/scripts/agent_v2/agent.py
      - name: Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ 2>/dev/null || true
          git commit -m "chore: agent v2.0 + H1 monitor cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Nothing to commit"
          git push || echo "Push failed"
